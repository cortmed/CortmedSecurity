# Her gece Cortmed Engine veritabanini yeniden derler ve "db-latest" surumune yukler.
# Uygulamalar su adreslerden gunceller:
#   https://github.com/<kullanici>/<depo>/releases/download/db-latest/version.txt
#   https://github.com/<kullanici>/<depo>/releases/download/db-latest/android.cmdb
#   https://github.com/<kullanici>/<depo>/releases/download/db-latest/windows.cmdb
#   https://github.com/<kullanici>/<depo>/releases/download/db-latest/android_rules.json
#   https://github.com/<kullanici>/<depo>/releases/download/db-latest/windows.yarc  (derlenmis YARA kurallari)
name: Cortmed DB guncelle

on:
  schedule:
    - cron: "17 2 * * *"   # her gece 02:17 UTC (05:17 TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: VirusShare onbellegi
        uses: actions/cache@v4
        with:
          path: engine/.cache
          key: virusshare-${{ github.run_id }}
          restore-keys: virusshare-

      - name: Veritabanini derle
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python engine/build_db.py --android-lists 8 --windows-lists 30

      - name: YARA kurallarini derle
        run: |
          pip install yara-python==4.5.4
          python engine/build_yara.py

      # Uygulamalar sadece bu imzayla dogrulanan dosyalari kabul eder; anahtar yoksa is durur
      - name: Dosyalari imzala
        env:
          DB_SIGNING_KEY: ${{ secrets.DB_SIGNING_KEY }}
        run: |
          pip install cryptography==44.0.2
          cp engine/rules/android_rules.json engine/dist/
          cp engine/rules/behavior_rules.json engine/dist/
          python engine/sign_db.py

      - name: db-latest surumune yukle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view db-latest >/dev/null 2>&1 || \
            gh release create db-latest --title "Cortmed DB" --notes "Otomatik gece guncellemesi"
          # Once dosyalar, en son imzali liste: cihaz yarim bir yuklemeyi gorurse parmak izleri tutmaz, reddeder
          gh release upload db-latest engine/dist/version.txt engine/dist/android.cmdb \
            engine/dist/windows.cmdb engine/dist/android_rules.json \
            engine/dist/windows.yarc engine/dist/yara-version.txt engine/dist/behavior_rules.json --clobber
          gh release upload db-latest engine/dist/manifest.json engine/dist/manifest.sig --clobber
